<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест 7.5 | Союзы</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .test-container { background: white; border-radius: 28px; padding: 25px; margin: 20px 0; border: 1px solid #d4e6c3; }
        .test-question { font-size: 1.1rem; margin-bottom: 20px; }
        .test-question p { margin-bottom: 15px; color: #2e6b3e; }
        .test-question label { display: block; background: #f5f9ef; padding: 10px 15px; border-radius: 50px; margin: 8px 0; cursor: pointer; transition: 0.2s; }
        .test-question label:hover { background: #c5e0b4; }
        .test-question input { margin-right: 12px; }
        .test-nav { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .primary-btn { background: #dba334; border: none; padding: 10px 28px; border-radius: 40px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .primary-btn:hover { background: #c2922a; transform: translateY(-2px); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2a6e3a; text-decoration: none; font-weight: bold; }
        .result-block { background: #e8f5e9; border-radius: 28px; padding: 20px; margin-top: 20px; text-align: center; font-weight: bold; }
        #qCounter { background: #f5f9ef; padding: 8px 20px; border-radius: 40px; font-weight: bold; color: #2e6b3e; }
        .button-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .reset-btn { background: #8b0000; border: none; padding: 10px 25px; border-radius: 40px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .reset-btn:hover { background: #660000; transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="ethnic-header"><div class="ornament-line top"></div><div class="title-main">Саха тыла — Тест</div><div class="school-badge">Электронное пособие для 5–7 классов</div><div class="ornament-line bottom"></div></div>
    <div class="nav-panel">
        <a href="../../index.html" class="nav-btn">Главная</a>
        <a href="../lessons/index.html" class="nav-btn">Уроки</a>
        <a href="../grammar/index.html" class="nav-btn">Грамматика</a>
        <a href="../dictionary/index.html" class="nav-btn">Словарь</a>
        <a href="index.html" class="nav-btn active">Тесты</a>
        <a href="../games/index.html" class="nav-btn">Игры</a>
        <a href="../progress/index.html" class="nav-btn">Прогресс</a>
    </div>
    <div class="page-content">
        <a href="index.html" class="back-link">← К списку тестов</a>
        <h2>Тест 7.5: Союзы</h2>
        <div class="test-container" id="testContainer"></div>
        <div class="test-nav"><button id="prevBtn" class="primary-btn">← Назад</button><span id="qCounter">Вопрос 1 / 15</span><button id="nextBtn" class="primary-btn">Далее →</button></div>
        <div class="button-group">
            <button id="submitBtn" class="primary-btn">Завершить тест</button>
            <button id="resetTestBtn" class="reset-btn" style="display: none;">Сбросить прогресс теста</button>
        </div>
        <div id="result" class="result-block" style="display: none;"></div>
    </div>
    <footer><div class="footer-ornament"></div><p>© МБОУ «Хоточчунская» ООШ</p></footer>
</div>
<script>
    const questions = [
        { text: "Как переводится союз 'уонна'?", options: ["Но", "И", "Поэтому", "Однако"], correct: 1 },
        { text: "Как переводится союз 'онон'?", options: ["И", "Но", "Поэтому", "Однако"], correct: 2 },
        { text: "Как переводится союз 'гынан баран'?", options: ["И", "Поэтому", "Однако", "Потому что"], correct: 2 },
        { text: "Как переводится союз 'ол эрээри'?", options: ["И", "Но", "Поэтому", "Потому что"], correct: 1 },
        { text: "Как будет 'я читаю и пишу' по-якутски?", options: ["Мин ааҕабын уонна суруйабын", "Мин ааҕабын онон суруйабын", "Мин ааҕабын гынан баран суруйабын", "Мин ааҕабын ол эрээри суруйабын"], correct: 0 },
        { text: "Как переводится 'Күн таҕыста, онон сылыйда'?", options: ["Солнце вышло, и стало тепло", "Солнце вышло, поэтому стало тепло", "Солнце вышло, но стало тепло", "Солнце вышло, однако стало тепло"], correct: 1 },
        { text: "Как будет 'хотя' по-якутски?", options: ["Уонна", "Онон", "Эрээри", "Гынан баран"], correct: 2 },
        { text: "Какой союз означает 'вдруг'?", options: ["Арай", "Уонна", "Онон", "Эрээри"], correct: 0 },
        { text: "Как будет 'как только' по-якутски?", options: ["Сотору кэминэ", "Арай", "Уонна", "Онон"], correct: 0 },
        { text: "Какой союз используется для выражения причины?", options: ["Уонна", "Онон", "Эрээри", "Арай"], correct: 1 },
        { text: "Как переводится 'арай'?", options: ["Вдруг", "И", "Поэтому", "Но"], correct: 0 },
        { text: "Как переводится 'сотору кэминэ'?", options: ["Вдруг", "Как только", "Поэтому", "Однако"], correct: 1 },
        { text: "Как будет 'он умный, но ленивый'?", options: ["Кини өйдөөх уонна сынньалаҥ", "Кини өйдөөх онон сынньалаҥ", "Кини өйдөөх гынан баран сынньалаҥ", "Кини өйдөөх арай сынньалаҥ"], correct: 2 },
        { text: "Какой союз соединяет однородные члены?", options: ["Онон", "Уонна", "Гынан баран", "Эрээри"], correct: 1 },
        { text: "Как переводится 'мин барабын, ол эрээри сарсын'?", options: ["Я иду, и завтра", "Я иду, поэтому завтра", "Я иду, но завтра", "Я иду, вдруг завтра"], correct: 2 }
    ];
    const testId = "test-7-5";
    let current = 0, answers = new Array(15).fill(null), testPassed = false, resultDisplayed = false;
    function loadProgress() { try { const saved = localStorage.getItem('yakut_test_results'); if (saved) { const results = JSON.parse(saved); testPassed = results.some(r => r.testId === testId); } } catch(e) {} const resetBtn = document.getElementById('resetTestBtn'); if (resetBtn) resetBtn.style.display = testPassed ? 'inline-block' : 'none'; }
    function saveProgress() { let stored = []; try { const saved = localStorage.getItem('yakut_test_results'); if (saved) stored = JSON.parse(saved); } catch(e) {} if (!stored.some(r => r.testId === testId)) { stored.push({ testId: testId, completedAt: Date.now() }); localStorage.setItem('yakut_test_results', JSON.stringify(stored)); testPassed = true; if (window.userProgress && window.userProgress.testsPassed && !window.userProgress.testsPassed.includes(testId)) window.userProgress.testsPassed.push(testId); const resetBtn = document.getElementById('resetTestBtn'); if (resetBtn) resetBtn.style.display = 'inline-block'; } }
    function resetTestProgress() { if (confirm('Сбросить прогресс этого теста? После сброса его можно пройти заново.')) { let stored = []; try { const saved = localStorage.getItem('yakut_test_results'); if (saved) stored = JSON.parse(saved); } catch(e) {} const newStored = stored.filter(r => r.testId !== testId); localStorage.setItem('yakut_test_results', JSON.stringify(newStored)); if (window.userProgress && window.userProgress.testsPassed) { const idx = window.userProgress.testsPassed.indexOf(testId); if (idx !== -1) window.userProgress.testsPassed.splice(idx, 1); } testPassed = false; resultDisplayed = false; const resetBtn = document.getElementById('resetTestBtn'); if (resetBtn) resetBtn.style.display = 'none'; const resultDiv = document.getElementById('result'); if (resultDiv) { resultDiv.style.display = 'none'; resultDiv.innerHTML = ''; } const submitBtn = document.getElementById('submitBtn'); if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = '1'; } alert('Прогресс теста сброшен!'); } }
    function render() { const q = questions[current]; let opts = ''; q.options.forEach((opt, i) => opts += `<label><input type="radio" name="q" value="${i}" ${answers[current] === i ? 'checked' : ''}> ${opt}</label>`); document.getElementById('testContainer').innerHTML = `<div class="test-question"><p><strong>${current+1}. ${q.text}</strong></p>${opts}</div>`; document.getElementById('qCounter').innerHTML = `Вопрос ${current+1} / 15`; }
    document.getElementById('prevBtn').onclick = () => { if (resultDisplayed) return; const s = document.querySelector('input[name="q"]:checked'); if(s) answers[current]=parseInt(s.value); if(current>0){current--;render();} };
    document.getElementById('nextBtn').onclick = () => { if (resultDisplayed) return; const s = document.querySelector('input[name="q"]:checked'); if(s) answers[current]=parseInt(s.value); if(current<14){current++;render();} };
    document.getElementById('submitBtn').onclick = () => { if (resultDisplayed) return; const s = document.querySelector('input[name="q"]:checked'); if(s) answers[current]=parseInt(s.value); let score=0; for(let i=0;i<15;i++) if(answers[i]===questions[i].correct) score++; let msg = `Результат: ${score}/15 (${Math.round(score/15*100)}%)`; if(score>=12) msg+="<br>Отлично!"; else if(score>=10) msg+="<br>Тест зачтён!"; else if(score>=8) msg+="<br>Неплохо, но стоит повторить."; else msg+="<br>Рекомендуем повторить уроки."; if(score>=10 && !testPassed){ msg+="<br>Прогресс сохранён!"; saveProgress(); } else if(score>=10 && testPassed){ msg+="<br>Тест уже был пройден."; } else if(score<10){ msg+="<br>Для зачёта нужно 10 баллов."; } document.getElementById('result').innerHTML = msg; document.getElementById('result').style.display = 'block'; document.getElementById('submitBtn').disabled = true; document.getElementById('submitBtn').style.opacity = '0.6'; resultDisplayed = true; };
    document.getElementById('resetTestBtn').onclick = resetTestProgress;
    loadProgress(); render();
</script>
</body>
</html>
