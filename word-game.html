<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери слово | Саха Тыла</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        /* ==================== АНИМАЦИИ ФОНА ==================== */
        @keyframes floatBg1 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-30px) translateX(20px) rotate(5deg); }
        }
        
        @keyframes floatBg2 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(25px) translateX(-25px) rotate(-3deg); }
        }
        
        @keyframes pulseBg {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Фоновый контейнер */
        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
        }
        
        /* Паттерн с орнаментом */
        .pattern-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }
        
        /* Плавающие круги */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,245,0.15);
            pointer-events: none;
        }
        
        .circle1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation: floatBg1 20s ease-in-out infinite;
        }
        
        .circle2 {
            width: 250px;
            height: 250px;
            bottom: -80px;
            right: -80px;
            animation: floatBg2 18s ease-in-out infinite;
        }
        
        .circle3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 70%;
            animation: floatBg1 15s ease-in-out infinite 2s;
        }
        
        .circle4 {
            width: 100px;
            height: 100px;
            top: 70%;
            left: 10%;
            animation: floatBg2 12s ease-in-out infinite 1s;
        }
        
        .circle5 {
            width: 180px;
            height: 180px;
            top: 15%;
            right: 15%;
            animation: pulseBg 8s ease-in-out infinite;
        }
        
        /* Плавающие точки */
        .floating-dot {
            position: absolute;
            background: rgba(219, 163, 52, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .dot1 { width: 8px; height: 8px; top: 20%; left: 15%; animation: floatBg1 10s ease-in-out infinite; }
        .dot2 { width: 12px; height: 12px; top: 50%; right: 20%; animation: floatBg2 12s ease-in-out infinite 1s; }
        .dot3 { width: 6px; height: 6px; bottom: 30%; left: 25%; animation: floatBg1 8s ease-in-out infinite 2s; }
        .dot4 { width: 10px; height: 10px; top: 75%; right: 35%; animation: floatBg2 14s ease-in-out infinite 0.5s; }
        .dot5 { width: 5px; height: 5px; top: 35%; left: 45%; animation: floatBg1 9s ease-in-out infinite 3s; }
        .dot6 { width: 7px; height: 7px; bottom: 15%; right: 55%; animation: floatBg2 11s ease-in-out infinite 2.5s; }
        
        /* Якутский орнамент (декоративные элементы) */
        .ornament-pattern {
            position: absolute;
            font-size: 40px;
            color: rgba(219, 163, 52, 0.08);
            pointer-events: none;
            font-family: serif;
        }
        
        .ornament1 { top: 5%; left: 2%; transform: rotate(-15deg); animation: rotateSlow 60s linear infinite; }
        .ornament2 { bottom: 8%; right: 3%; transform: rotate(10deg); animation: rotateSlow 45s linear infinite reverse; }
        .ornament3 { top: 30%; right: 8%; font-size: 30px; animation: rotateSlow 50s linear infinite; }
        .ornament4 { bottom: 20%; left: 5%; font-size: 35px; animation: rotateSlow 55s linear infinite reverse; }
        .ornament5 { top: 60%; left: 15%; font-size: 25px; animation: rotateSlow 40s linear infinite; }
        
        /* Основной контейнер */
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 15px;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .game-header h1 {
            color: #2a6e3a;
            font-size: 1.8rem;
        }
        
        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }
        
        .level-badge {
            background: #2a6e3a;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .score-badge {
            background: #dba334;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .round-badge {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .scramble-word {
            text-align: center;
            font-size: 2rem;
            letter-spacing: 8px;
            background: rgba(255,255,245,0.9);
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            color: #2e6b3e;
            font-weight: bold;
            word-break: break-all;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }
        
        .scramble-input {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: 2px solid #d4e6c3;
            font-size: 1rem;
            text-align: center;
            margin: 15px 0;
            background: rgba(255,255,255,0.9);
        }
        
        .scramble-input:focus {
            outline: none;
            border-color: #dba334;
            box-shadow: 0 0 10px rgba(219,163,52,0.3);
        }
        
        .check-btn {
            background: #dba334;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: block;
            margin: 0 auto;
            transition: all 0.3s;
        }
        
        .check-btn:hover {
            background: #c2922a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .game-result {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 20px;
        }
        
        .game-result.correct { background: #c8e6c9; color: #2e7d32; }
        .game-result.incorrect { background: #ffccbc; color: #bf360c; }
        
        .restart-btn, .next-level-btn {
            background: #dba334;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: inline-block;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .restart-btn:hover, .next-level-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .next-level-btn {
            background: #2a6e3a;
        }
        
        .reset-progress-btn {
            background: #8b0000;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .reset-progress-btn:hover {
            background: #660000;
            transform: translateY(-2px);
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a6e3a;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 30px;
            backdrop-filter: blur(3px);
            transition: all 0.3s;
        }
        
        .back-link:hover {
            transform: translateX(-5px);
            color: #dba334;
        }
        
        .congrats {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #c8e6c9, #e8f5e9);
            border-radius: 28px;
            margin: 20px 0;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .congrats h2 {
            color: #2a6e3a;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 600px) {
            .scramble-word { font-size: 1.5rem; letter-spacing: 5px; }
            .floating-circle { display: none; }
        }
    </style>
</head>
<body>
<!-- Фоновый контент -->
<div class="game-background">
    <div class="pattern-overlay"></div>
    <div class="floating-circle circle1"></div>
    <div class="floating-circle circle2"></div>
    <div class="floating-circle circle3"></div>
    <div class="floating-circle circle4"></div>
    <div class="floating-circle circle5"></div>
    <div class="floating-dot dot1"></div>
    <div class="floating-dot dot2"></div>
    <div class="floating-dot dot3"></div>
    <div class="floating-dot dot4"></div>
    <div class="floating-dot dot5"></div>
    <div class="floating-dot dot6"></div>
    <div class="ornament-pattern ornament1">✦</div>
    <div class="ornament-pattern ornament2">✧</div>
    <div class="ornament-pattern ornament3">❦</div>
    <div class="ornament-pattern ornament4">⚘</div>
    <div class="ornament-pattern ornament5">✦</div>
</div>

<div class="app-wrapper">
    <div class="ethnic-header">
        <div class="ornament-line top"></div>
        <div class="title-main">Саха тыла — Собери слово</div>
        <div class="school-badge">Игра</div>
        <div class="ornament-line bottom"></div>
    </div>
    <div class="nav-panel">
        <a href="../../index.html" class="nav-btn">Главная</a>
        <a href="../lessons/index.html" class="nav-btn">Уроки</a>
        <a href="../grammar/index.html" class="nav-btn">Грамматика</a>
        <a href="../dictionary/index.html" class="nav-btn">Словарь</a>
        <a href="../tests/index.html" class="nav-btn">Тесты</a>
        <a href="index.html" class="nav-btn">Игры</a>
        <a href="../progress/index.html" class="nav-btn">Прогресс</a>
    </div>
    <div class="page-content">
        <div class="game-container">
            <a href="index.html" class="back-link">← Назад к играм</a>
            <div class="game-header">
                <h1>Собери слово</h1>
                <p>Из перемешанных букв составьте правильное слово</p>
            </div>
            
            <div class="level-info">
                <span class="level-badge" id="levelDisplay">Уровень 1</span>
                <span class="score-badge" id="scoreDisplay">Счёт: 0</span>
                <span class="round-badge" id="roundDisplay">Раунд: 0/3</span>
            </div>
            
            <div id="gameContent"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="reset-progress-btn" onclick="resetProgress()">Сбросить прогресс</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-ornament"></div>
        <p>© МБОУ «Хоточчунская» ООШ</p>
    </footer>
</div>

<script>
    // Слова для разных уровней сложности (по длине слов)
    const wordsByLevel = {
        1: ["күн", "ый", "ат", "ыт", "уу"],
        2: ["кыыс", "уол", "аҕа", "ийэ", "балык"],
        3: ["кинигэ", "дьиэ", "күөх", "хара", "үрүҥ"],
        4: ["куобах", "куоска", "кыһыл", "быраат", "балыс"],
        5: ["оскуола", "учуутал", "үөрэнээччи"],
        6: ["көтөрдөр", "ыалдьыттар", "биһиги", "эһиги"],
        7: ["кинилэр", "математика", "библиотека"],
        8: ["ыччаттар", "үөрэммит", "күндүтэ"],
        9: ["үөрэнээччилэр", "кылаастар", "традиция"],
        10: ["доҕордоһуу", "маанылааһын", "кэрэхсэбил"]
    };
    
    let currentLevel = 1;
    let currentRound = 0;
    let levelScore = 0;
    let currentWord = null;
    let currentScrambled = "";
    let isWaiting = false;
    
    const roundsPerLevel = 3;
    
    function loadProgress() {
        const savedLevel = localStorage.getItem('scramble_game_level');
        if (savedLevel) {
            currentLevel = parseInt(savedLevel);
            if (currentLevel > 10) currentLevel = 10;
        }
        updateLevelDisplay();
    }
    
    function saveProgress() {
        localStorage.setItem('scramble_game_level', currentLevel);
    }
    
    function resetProgress() {
        if (confirm('Сбросить прогресс? Все пройденные уровни будут удалены.')) {
            currentLevel = 1;
            saveProgress();
            startLevel();
        }
    }
    
    function updateLevelDisplay() {
        document.getElementById('levelDisplay').innerHTML = `Уровень ${currentLevel}`;
        document.getElementById('roundDisplay').innerHTML = `Раунд: ${currentRound}/${roundsPerLevel}`;
    }
    
    function updateScoreDisplay() {
        document.getElementById('scoreDisplay').innerHTML = `Счёт: ${levelScore}/${currentRound}`;
    }
    
    function scrambleString(str) {
        let arr = str.split('');
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr.join('');
    }
    
    function getWordForCurrentRound() {
        const levelWords = wordsByLevel[currentLevel];
        if (!levelWords || levelWords.length === 0) {
            return { yak: "саха", ru: "якут" };
        }
        const randomIndex = Math.floor(Math.random() * levelWords.length);
        const yakWord = levelWords[randomIndex];
        return { yak: yakWord, ru: getTranslation(yakWord) };
    }
    
    function getTranslation(word) {
        const translations = {
            "күн": "солнце", "ый": "луна", "ат": "лошадь", "ыт": "собака",
            "кыыс": "девочка", "уол": "мальчик", "аҕа": "отец", "ийэ": "мать",
            "балык": "рыба", "кинигэ": "книга", "дьиэ": "дом", "күөх": "зелёный",
            "хара": "чёрный", "үрүҥ": "белый", "куобах": "заяц", "куоска": "кошка",
            "кыһыл": "красный", "быраат": "брат", "балыс": "сестра", "оскуола": "школа",
            "учуутал": "учитель", "үөрэнээччи": "ученик", "көтөрдөр": "птицы",
            "ыалдьыттар": "гости", "биһиги": "мы", "эһиги": "вы", "кинилэр": "они",
            "математика": "математика", "библиотека": "библиотека", "ыччаттар": "молодёжь",
            "үөрэммит": "изученный", "күндүтэ": "драгоценность", "үөрэнээччилэр": "ученики",
            "кылаастар": "классы", "традиция": "традиция", "доҕордоһуу": "дружба",
            "маанылааһын": "уважение", "кэрэхсэбил": "интерес"
        };
        return translations[word] || "слово";
    }
    
    function startLevel() {
        currentRound = 0;
        levelScore = 0;
        updateLevelDisplay();
        updateScoreDisplay();
        nextWord();
    }
    
    function nextWord() {
        if (currentRound >= roundsPerLevel) {
            if (currentLevel === 10) {
                document.getElementById('gameContent').innerHTML = `
                    <div class="congrats">
                        <h2>ПОЗДРАВЛЯЕМ!</h2>
                        <h3>Вы прошли ВСЕ 10 уровней игры!</h3>
                        <p>Вы настоящий мастер якутского языка!</p>
                        <div class="button-group">
                            <button class="restart-btn" onclick="resetToLevel1()">Начать заново</button>
                            <button class="next-level-btn" onclick="window.location.href='index.html'">Вернуться к играм</button>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('gameContent').innerHTML = `
                    <div class="congrats">
                        <h2>Уровень ${currentLevel} пройден!</h2>
                        <p>Вы набрали ${levelScore} из ${roundsPerLevel} очков!</p>
                        <div class="button-group">
                            <button class="restart-btn" onclick="restartCurrentLevel()">Пройти заново</button>
                            <button class="next-level-btn" onclick="nextLevel()">Следующий уровень →</button>
                        </div>
                    </div>
                `;
            }
            return;
        }
        
        currentWord = getWordForCurrentRound();
        currentScrambled = scrambleString(currentWord.yak);
        renderGame();
    }
    
    function renderGame() {
        const container = document.getElementById('gameContent');
        container.innerHTML = `
            <div class="scramble-word">${currentScrambled}</div>
            <div class="scramble-hint" style="text-align:center; color:#888;">Подсказка: перевод — "${currentWord.ru}"</div>
            <input type="text" id="answerInput" class="scramble-input" placeholder="Введите слово на якутском..." autocomplete="off">
            <button class="check-btn" onclick="checkAnswer()">Проверить</button>
            <div id="resultDiv" class="game-result"></div>
        `;
        document.getElementById('answerInput').focus();
    }
    
    function checkAnswer() {
        if (isWaiting) return;
        
        const input = document.getElementById('answerInput');
        const resultDiv = document.getElementById('resultDiv');
        const userAnswer = input.value.trim().toLowerCase();
        const correctAnswer = currentWord.yak.toLowerCase();
        
        isWaiting = true;
        
        if (userAnswer === correctAnswer) {
            levelScore++;
            resultDiv.innerHTML = 'Правильно!';
            resultDiv.className = 'game-result correct';
        } else {
            resultDiv.innerHTML = `Неправильно. Правильный ответ: ${correctAnswer}`;
            resultDiv.className = 'game-result incorrect';
        }
        
        currentRound++;
        updateScoreDisplay();
        updateLevelDisplay();
        
        setTimeout(() => {
            isWaiting = false;
            nextWord();
        }, 1500);
    }
    
    function nextLevel() {
        if (currentLevel < 10) {
            currentLevel++;
            saveProgress();
            startLevel();
        }
    }
    
    function restartCurrentLevel() {
        startLevel();
    }
    
    function resetToLevel1() {
        currentLevel = 1;
        saveProgress();
        startLevel();
    }
    
    loadProgress();
    startLevel();
    
    window.checkAnswer = checkAnswer;
    window.nextLevel = nextLevel;
    window.restartCurrentLevel = restartCurrentLevel;
    window.resetToLevel1 = resetToLevel1;
    window.resetProgress = resetProgress;
</script>
</body>
</html>
