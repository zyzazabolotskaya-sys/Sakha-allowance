<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди пару | Саха Тыла</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        /* ==================== АНИМАЦИИ ФОНА ==================== */
        @keyframes floatBg1 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(-30px) translateX(20px) rotate(5deg); }
        }
        
        @keyframes floatBg2 {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            50% { transform: translateY(25px) translateX(-25px) rotate(-3deg); }
        }
        
        @keyframes pulseBg {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Фоновый контейнер */
        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 50%, #a5d6a7 100%);
        }
        
        /* Паттерн с орнаментом */
        .pattern-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
        }
        
        /* Плавающие круги */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,245,0.15);
            pointer-events: none;
        }
        
        .circle1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation: floatBg1 20s ease-in-out infinite;
        }
        
        .circle2 {
            width: 250px;
            height: 250px;
            bottom: -80px;
            right: -80px;
            animation: floatBg2 18s ease-in-out infinite;
        }
        
        .circle3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 70%;
            animation: floatBg1 15s ease-in-out infinite 2s;
        }
        
        .circle4 {
            width: 100px;
            height: 100px;
            top: 70%;
            left: 10%;
            animation: floatBg2 12s ease-in-out infinite 1s;
        }
        
        .circle5 {
            width: 180px;
            height: 180px;
            top: 15%;
            right: 15%;
            animation: pulseBg 8s ease-in-out infinite;
        }
        
        /* Плавающие точки */
        .floating-dot {
            position: absolute;
            background: rgba(219, 163, 52, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .dot1 { width: 8px; height: 8px; top: 20%; left: 15%; animation: floatBg1 10s ease-in-out infinite; }
        .dot2 { width: 12px; height: 12px; top: 50%; right: 20%; animation: floatBg2 12s ease-in-out infinite 1s; }
        .dot3 { width: 6px; height: 6px; bottom: 30%; left: 25%; animation: floatBg1 8s ease-in-out infinite 2s; }
        .dot4 { width: 10px; height: 10px; top: 75%; right: 35%; animation: floatBg2 14s ease-in-out infinite 0.5s; }
        .dot5 { width: 5px; height: 5px; top: 35%; left: 45%; animation: floatBg1 9s ease-in-out infinite 3s; }
        .dot6 { width: 7px; height: 7px; bottom: 15%; right: 55%; animation: floatBg2 11s ease-in-out infinite 2.5s; }
        
        /* Якутский орнамент (декоративные элементы) */
        .ornament-pattern {
            position: absolute;
            font-size: 40px;
            color: rgba(219, 163, 52, 0.08);
            pointer-events: none;
            font-family: serif;
        }
        
        .ornament1 { top: 5%; left: 2%; transform: rotate(-15deg); animation: rotateSlow 60s linear infinite; }
        .ornament2 { bottom: 8%; right: 3%; transform: rotate(10deg); animation: rotateSlow 45s linear infinite reverse; }
        .ornament3 { top: 30%; right: 8%; font-size: 30px; animation: rotateSlow 50s linear infinite; }
        .ornament4 { bottom: 20%; left: 5%; font-size: 35px; animation: rotateSlow 55s linear infinite reverse; }
        .ornament5 { top: 60%; left: 15%; font-size: 25px; animation: rotateSlow 40s linear infinite; }
        
        /* Основной контейнер */
        .game-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 15px;
        }
        
        .game-header h1 {
            color: #2a6e3a;
            font-size: 1.8rem;
        }
        
        .level-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            padding: 15px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
        }
        
        .level-badge {
            background: #2a6e3a;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .score-badge {
            background: #dba334;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .pairs-badge {
            background: #c8e6c9;
            color: #2e7d32;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .memory-grid {
            display: grid;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
        }
        
        .memory-card {
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #2a6e3a, #1b4d2a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            text-align: center;
            padding: 10px;
            word-break: break-word;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .memory-card.flipped {
            background: white;
            border: 2px solid #dba334;
            color: #2e6b3e;
        }
        
        .memory-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
        
        .restart-btn, .next-level-btn {
            background: #dba334;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin: 10px;
        }
        
        .next-level-btn {
            background: #2a6e3a;
        }
        
        .reset-progress-btn {
            background: #8b0000;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-top: 20px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a6e3a;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 30px;
            backdrop-filter: blur(3px);
        }
        
        .congrats {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #c8e6c9, #e8f5e9);
            border-radius: 28px;
            margin: 20px 0;
        }
        
        .congrats h2 {
            color: #2a6e3a;
            margin-bottom: 15px;
        }
        
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .memory-grid { gap: 10px; }
            .memory-card { font-size: 0.8rem; padding: 5px; }
            .floating-circle { display: none; }
        }
    </style>
</head>
<body>
<!-- Фоновый контент -->
<div class="game-background">
    <div class="pattern-overlay"></div>
    <div class="floating-circle circle1"></div>
    <div class="floating-circle circle2"></div>
    <div class="floating-circle circle3"></div>
    <div class="floating-circle circle4"></div>
    <div class="floating-circle circle5"></div>
    <div class="floating-dot dot1"></div>
    <div class="floating-dot dot2"></div>
    <div class="floating-dot dot3"></div>
    <div class="floating-dot dot4"></div>
    <div class="floating-dot dot5"></div>
    <div class="floating-dot dot6"></div>
    <div class="ornament-pattern ornament1">✦</div>
    <div class="ornament-pattern ornament2">✧</div>
    <div class="ornament-pattern ornament3">❦</div>
    <div class="ornament-pattern ornament4">⚘</div>
    <div class="ornament-pattern ornament5">✦</div>
</div>

<div class="app-wrapper">
    <div class="ethnic-header">
        <div class="ornament-line top"></div>
        <div class="title-main">Саха тыла — Найди пару</div>
        <div class="school-badge">Игра</div>
        <div class="ornament-line bottom"></div>
    </div>
    <div class="nav-panel">
        <a href="../../index.html" class="nav-btn">Главная</a>
        <a href="../lessons/index.html" class="nav-btn">Уроки</a>
        <a href="../grammar/index.html" class="nav-btn">Грамматика</a>
        <a href="../dictionary/index.html" class="nav-btn">Словарь</a>
        <a href="../tests/index.html" class="nav-btn">Тесты</a>
        <a href="index.html" class="nav-btn">Игры</a>
        <a href="../progress/index.html" class="nav-btn">Прогресс</a>
    </div>
    <div class="page-content">
        <div class="game-container">
            <a href="index.html" class="back-link">← Назад к играм</a>
            <div class="game-header">
                <h1>Найди пару</h1>
                <p>Найдите пары: якутское слово и его перевод</p>
            </div>
            
            <div class="level-info">
                <span class="level-badge" id="levelDisplay">Уровень 1</span>
                <span class="score-badge" id="scoreDisplay">Счёт: 0</span>
                <span class="pairs-badge" id="pairsDisplay">Пар: 4</span>
            </div>
            
            <div id="gameContent"></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="reset-progress-btn" onclick="resetProgress()">Сбросить прогресс</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-ornament"></div>
        <p>© МБОУ «Хоточчунская» ООШ</p>
    </footer>
</div>

<script>
    // Базовый словарь слов (можно расширять)
    const baseWords = [
        { yak: "күн", ru: "солнце" }, { yak: "ый", ru: "луна" },
        { yak: "уу", ru: "вода" }, { yak: "кинигэ", ru: "книга" },
        { yak: "уол", ru: "мальчик" }, { yak: "кыыс", ru: "девочка" },
        { yak: "куобах", ru: "заяц" }, { yak: "балык", ru: "рыба" },
        { yak: "ыт", ru: "собака" }, { yak: "куоска", ru: "кошка" },
        { yak: "ат", ru: "лошадь" }, { yak: "күөх", ru: "зелёный" },
        { yak: "кыһыл", ru: "красный" }, { yak: "үрүҥ", ru: "белый" },
        { yak: "хара", ru: "чёрный" }, { yak: "аҕа", ru: "отец" },
        { yak: "ийэ", ru: "мать" }, { yak: "быраат", ru: "брат" },
        { yak: "балыс", ru: "сестра" }, { yak: "дьиэ", ru: "дом" },
        { yak: "оскуола", ru: "школа" }, { yak: "учуутал", ru: "учитель" },
        { yak: "үөрэнээччи", ru: "ученик" }, { yak: "кымыс", ru: "кумыс" },
        { yak: "хомус", ru: "варган" }, { yak: "ысыах", ru: "праздник лета" }
    ];
    
    // Настройки уровней (количество пар на каждом уровне)
    const levelPairs = {
        1: 4, 2: 5, 3: 6, 4: 7, 5: 8,
        6: 10, 7: 12, 8: 14, 9: 16, 10: 20
    };
    
    let currentLevel = 1;
    let currentPairsCount = 4;
    let currentWords = [];
    let memoryCards = [];
    let memoryFlipped = [];
    let memoryLocked = false;
    let memoryMatchedPairs = 0;
    let moves = 0;
    
    // Загрузка сохранённого прогресса
    function loadProgress() {
        const saved = localStorage.getItem('pair_game_level');
        if (saved) {
            currentLevel = parseInt(saved);
            if (currentLevel > 10) currentLevel = 10;
        }
        updateLevelDisplay();
    }
    
    function saveProgress() {
        localStorage.setItem('pair_game_level', currentLevel);
    }
    
    function resetProgress() {
        if (confirm('Сбросить прогресс? Все пройденные уровни будут удалены.')) {
            currentLevel = 1;
            saveProgress();
            initGame();
        }
    }
    
    function updateLevelDisplay() {
        document.getElementById('levelDisplay').innerHTML = `Уровень ${currentLevel}`;
        currentPairsCount = levelPairs[currentLevel] || 4;
        document.getElementById('pairsDisplay').innerHTML = `Пар: ${currentPairsCount}`;
    }
    
    function updateScoreDisplay() {
        document.getElementById('scoreDisplay').innerHTML = `Счёт: ${memoryMatchedPairs}/${currentPairsCount}`;
    }
    
    // Получение слов для текущего уровня
    function getWordsForLevel() {
        const neededPairs = currentPairsCount;
        const shuffledBase = [...baseWords];
        for (let i = shuffledBase.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledBase[i], shuffledBase[j]] = [shuffledBase[j], shuffledBase[i]];
        }
        return shuffledBase.slice(0, neededPairs);
    }
    
    function initGame() {
        currentWords = getWordsForLevel();
        memoryCards = [];
        currentWords.forEach((word, idx) => {
            memoryCards.push({ id: idx * 2, text: word.yak, pairId: idx, matched: false });
            memoryCards.push({ id: idx * 2 + 1, text: word.ru, pairId: idx, matched: false });
        });
        for (let i = memoryCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [memoryCards[i], memoryCards[j]] = [memoryCards[j], memoryCards[i]];
        }
        memoryFlipped = [];
        memoryLocked = false;
        memoryMatchedPairs = 0;
        moves = 0;
        updateScoreDisplay();
        
        // Настройка сетки в зависимости от количества карточек
        const totalCards = memoryCards.length;
        let columns = 4;
        if (totalCards <= 16) columns = 4;
        else if (totalCards <= 25) columns = 5;
        else columns = 6;
        
        const gridContainer = document.getElementById('gameContent');
        if (gridContainer) {
            gridContainer.style.display = 'flex';
            gridContainer.style.flexDirection = 'column';
        }
        
        renderGame();
    }
    
    function renderGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        if (memoryMatchedPairs === currentPairsCount) {
            // Уровень пройден!
            if (currentLevel === 10) {
                container.innerHTML = `
                    <div class="congrats">
                        <h2>ПОЗДРАВЛЯЕМ!</h2>
                        <h3>Вы прошли ВСЕ 10 уровней игры!</h3>
                        <p>Вы настоящий знаток якутского языка!</p>
                        <div class="button-group">
                            <button class="restart-btn" onclick="resetToLevel1()">Начать заново</button>
                            <button class="next-level-btn" onclick="window.location.href='index.html'">Вернуться к играм</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="congrats">
                        <h2>Уровень ${currentLevel} пройден!</h2>
                        <p>Вы нашли все ${currentPairsCount} пар!</p>
                        <div class="button-group">
                            <button class="restart-btn" onclick="restartCurrentLevel()">Пройти заново</button>
                            <button class="next-level-btn" onclick="nextLevel()">Следующий уровень →</button>
                        </div>
                    </div>
                `;
            }
            return;
        }
        
        const totalCards = memoryCards.length;
        let columns = 4;
        if (totalCards <= 16) columns = 4;
        else if (totalCards <= 25) columns = 5;
        else columns = 6;
        
        container.innerHTML = `
            <div class="memory-grid" style="grid-template-columns: repeat(${columns}, 1fr);">
                ${memoryCards.map((card, idx) => {
                    const isFlipped = memoryFlipped.includes(idx);
                    const displayText = (isFlipped || card.matched) ? card.text : '?';
                    const additionalClass = card.matched ? 'matched' : (isFlipped ? 'flipped' : '');
                    return `<div class="memory-card ${additionalClass}" data-index="${idx}">${displayText}</div>`;
                }).join('')}
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="restart-btn" onclick="restartCurrentLevel()">Начать уровень заново</button>
            </div>
        `;
        
        // Привязываем обработчики
        document.querySelectorAll('.memory-card').forEach(card => {
            card.addEventListener('click', () => {
                const idx = parseInt(card.dataset.index);
                if (!memoryLocked && !memoryCards[idx].matched && !memoryFlipped.includes(idx)) {
                    flipCard(idx);
                }
            });
        });
    }
    
    function flipCard(idx) {
        memoryFlipped.push(idx);
        
        if (memoryFlipped.length === 2) {
            memoryLocked = true;
            const card1 = memoryCards[memoryFlipped[0]];
            const card2 = memoryCards[memoryFlipped[1]];
            
            if (card1.pairId === card2.pairId) {
                memoryCards[memoryFlipped[0]].matched = true;
                memoryCards[memoryFlipped[1]].matched = true;
                memoryMatchedPairs++;
                memoryFlipped = [];
                memoryLocked = false;
                updateScoreDisplay();
                renderGame();
            } else {
                setTimeout(() => {
                    memoryFlipped = [];
                    memoryLocked = false;
                    renderGame();
                }, 800);
            }
        }
        renderGame();
    }
    
    function nextLevel() {
        if (currentLevel < 10) {
            currentLevel++;
            saveProgress();
            initGame();
        }
    }
    
    function restartCurrentLevel() {
        initGame();
    }
    
    function resetToLevel1() {
        currentLevel = 1;
        saveProgress();
        initGame();
    }
    
    // Инициализация
    loadProgress();
    initGame();
</script>
</body>
</html>
